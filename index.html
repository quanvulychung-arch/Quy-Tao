<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quỹ Tao: Sóng Gió Tín Dụng</title>
    <style>
        :root {
            --bg: #0b0f19;
            --panel: #151d2e;
            --panel-border: #243048;
            --accent: #f59e0b;
            --danger: #ef4444;
            --success: #10b981;
            --info: #38bdf8;
            --pink: #ec4899;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --ambient-overlay: rgba(0,0,0,0);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #030712;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-app {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 940px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--panel-border);
            transition: background 0.8s ease;
        }

        @media (min-width: 460px) {
            #game-app {
                height: 94vh;
                border-radius: 28px;
                box-shadow: 0 0 40px rgba(0,0,0,0.9);
            }
        }

        /* Ambient Day / Sunset / Night Overlay */
        #ambient-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 15;
            transition: background 0.8s ease;
        }

        /* Day/Night Theme Classes */
        .sky-morning { background: linear-gradient(180deg, #1e3a8a 0%, #0b0f19 100%) !important; }
        .sky-noon { background: linear-gradient(180deg, #0284c7 0%, #0b0f19 100%) !important; }
        .sky-sunset { background: linear-gradient(180deg, #9a3412 0%, #311042 50%, #0b0f19 100%) !important; }
        .sky-night { background: linear-gradient(180deg, #050814 0%, #02040a 100%) !important; }

        /* Top HUD */
        .hud-header {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid var(--panel-border);
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 20;
        }

        .row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
        }

        .badge {
            background: #1e293b;
            padding: 3px 8px;
            border-radius: 10px;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .clock-badge {
            background: #0f172a;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 5px;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 4px rgba(245, 158, 11, 0.2); }
            to { box-shadow: 0 0 10px rgba(245, 158, 11, 0.6); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            font-size: 10.5px;
        }

        .stat-card {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            padding: 4px 2px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-label {
            font-size: 8.5px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .stat-val {
            font-weight: 800;
            font-size: 11.5px;
            color: #fff;
        }

        /* Scandal Progress */
        .scandal-bar-container {
            background: #1e1b4b;
            border: 1px solid var(--pink);
            border-radius: 8px;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10.5px;
            font-weight: bold;
            color: #fbcfe8;
        }

        .scandal-fill {
            background: var(--pink);
            height: 6px;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* Zalo Stream */
        .zalo-stream {
            background: #0d2847;
            border-left: 3px solid #38bdf8;
            padding: 5px 8px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #bae6fd;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            cursor: pointer;
            z-index: 20;
        }

        /* Main Viewport */
        #game-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            z-index: 10;
        }

        /* Dynamic Event Card */
        .event-card {
            background: rgba(21, 29, 46, 0.95);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .event-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .char-avatar {
            width: 44px;
            height: 44px;
            background: #1e293b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            border: 2px solid var(--accent);
            flex-shrink: 0;
        }

        .event-desc {
            font-size: 13px;
            line-height: 1.5;
            color: #cbd5e1;
            background: #090e17;
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid var(--pink);
        }

        /* CCTV Box */
        .cctv-screen {
            background: #000;
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 12px;
            position: relative;
            color: #22c55e;
            font-family: monospace;
            font-size: 11.5px;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: hidden;
        }

        .cctv-overlay {
            position: absolute;
            top: 6px;
            right: 8px;
            color: #ef4444;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* Buttons */
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            color: #fff;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
            line-height: 1.35;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-tag {
            font-size: 9.5px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(0,0,0,0.4);
            white-space: nowrap;
            margin-left: 6px;
        }

        .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); }
        .btn-pink { background: #be185d; color: #fff; border-color: var(--pink); }
        .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
        .btn-success { background: var(--success); color: #000; border-color: var(--success); }
        .btn-info { background: #0284c7; color: #fff; border-color: #0284c7; }

        /* Bottom Nav */
        .bottom-nav {
            background: #0f172a;
            border-top: 1px solid var(--panel-border);
            padding: 6px 8px 12px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            z-index: 20;
        }

        .tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-dim);
            font-size: 9.5px;
            gap: 3px;
            cursor: pointer;
            padding: 5px 2px;
            border-radius: 6px;
        }

        .tab-btn.active {
            color: var(--accent);
            background: rgba(245, 158, 11, 0.1);
        }

        .tab-icon { font-size: 16px; }

        /* Modal */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 16px;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

<div id="game-app" class="sky-morning">
    <div id="ambient-layer"></div>

    <!-- HUD Header -->
    <div class="hud-header">
        <div class="row-top">
            <div class="badge" style="color:var(--accent);">
                <span>📅 Ngày <span id="ui-day-count">1</span>: <span id="ui-day-name">Thứ 2</span></span>
            </div>

            <!-- In-game Clock & Sky Status -->
            <div class="clock-badge">
                <span id="ui-sky-icon">🌅</span>
                <span id="ui-clock">07:30</span>
                <span style="font-size:9.5px; color:#cbd5e1;" id="ui-period-text">(Sáng Sớm)</span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Ví Lương</div>
                <div class="stat-val" id="ui-wallet" style="color:var(--accent);">4.0Tr</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Tiến Độ Tháng</div>
                <div class="stat-val" id="ui-quota">0/150Tr</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Tinh Thần</div>
                <div class="stat-val" id="ui-sanity" style="color:var(--success);">100%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Sếp Nộ Khí</div>
                <div class="stat-val" id="ui-rage" style="color:var(--danger);">10%</div>
            </div>
        </div>

        <!-- Extramarital Scandal Meter -->
        <div class="scandal-bar-container">
            <span>🔥 Bằng Chứng Mập Mờ Hướng - Nguyễn:</span>
            <span id="ui-scandal-val">0%</span>
        </div>
        <div style="background:#090e17; height:5px; border-radius:3px; overflow:hidden;">
            <div class="scandal-fill" id="ui-scandal-bar" style="width: 0%;"></div>
        </div>
    </div>

    <!-- Live Zalo Feed -->
    <div class="zalo-stream" onclick="openZaloModal()">
        <span>📱</span>
        <span id="zalo-msg"><b>Zalo Chi Nhánh:</b> Nguyễn: "Sáng nay họp giao ban đúng giờ nhé!"</span>
    </div>

    <!-- Main Viewport -->
    <div id="game-content"></div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="tab-btn active" onclick="switchTab('daily_event')">
            <span class="tab-icon">🎭</span>
            <span>Sự Kiện Ngày</span>
        </div>
        <div class="tab-btn" onclick="switchTab('cctv_spy')">
            <span class="tab-icon">📹</span>
            <span>Camera Mật</span>
        </div>
        <div class="tab-btn" onclick="switchTab('field_work')">
            <span class="tab-icon">🛵</span>
            <span>Đi Thực Địa</span>
        </div>
        <div class="tab-btn" onclick="switchTab('next_day')">
            <span class="tab-icon">🌙</span>
            <span>Hết Ngày / Ngủ</span>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="game-modal">
        <div class="modal-box" id="modal-body"></div>
    </div>
</div>

<script>
    // Audio Synthesis
    const Audio = {
        ctx: null,
        init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
        play(freq, type='sine', duration=0.1) {
            try {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }catch(e){}
        },
        click() { this.play(550, 'triangle', 0.06); },
        success() { 
            this.play(523, 'sine', 0.08); 
            setTimeout(() => this.play(659, 'sine', 0.12), 80);
        },
        payday() {
            this.play(659, 'sine', 0.1);
            setTimeout(() => this.play(784, 'sine', 0.15), 100);
            setTimeout(() => this.play(1046, 'sine', 0.25), 200);
        },
        alarm() { this.play(180, 'sawtooth', 0.25); }
    };

    // Progression State with 24h Clock
    const Game = {
        day: 1,
        hour: 7,
        minute: 30,
        dayNames: [
            "Thứ 2 (Giao Ban Đầu Tuần)",
            "Thứ 3 (Ngày Bình Yên - Trà Sữa)",
            "Thứ 4 (Cơm Trưa Bóc Tôm & Mùi Hương)",
            "Thứ 5 (NGÀY NHẬN LƯƠNG TING TING 💸)",
            "Thứ 6 (Check Camera Mập Mờ 19h30)",
            "Thứ 7 (Ngày Hội Thu Tiền Xã Áp Lực)",
            "Chủ Nhật (Bàn Nhậu Karaoke & Vợ Nguyễn Đến)"
        ],
        wallet: 4000000,
        quota: 20000000,
        quotaTarget: 150000000,
        sanity: 100,
        bossRage: 10,
        scandal: 0,
        cctvClues: 0,
        activeTab: 'daily_event',
        zaloLogs: []
    };

    // Time advancement helper
    function advanceTime(hours, minutes) {
        Game.minute += minutes;
        Game.hour += hours + Math.floor(Game.minute / 60);
        Game.minute = Game.minute % 60;
        updateTimeAndSky();
    }

    // Dynamic Sky and Day/Night Engine
    function updateTimeAndSky() {
        const app = document.getElementById('game-app');
        const ambient = document.getElementById('ambient-layer');
        const skyIcon = document.getElementById('ui-sky-icon');
        const periodText = document.getElementById('ui-period-text');

        app.className = '';

        if (Game.hour >= 6 && Game.hour < 11) {
            // Sáng sớm / Sáng trong lành
            app.classList.add('sky-morning');
            ambient.style.background = 'rgba(245, 158, 11, 0.05)';
            skyIcon.innerText = '🌅';
            periodText.innerText = '(Buổi Sáng)';
        } else if (Game.hour >= 11 && Game.hour < 16) {
            // Trưa nắng gắt
            app.classList.add('sky-noon');
            ambient.style.background = 'rgba(56, 189, 248, 0.08)';
            skyIcon.innerText = '☀️';
            periodText.innerText = '(Nắng Trưa 39°C)';
        } else if (Game.hour >= 16 && Game.hour < 18) {
            // Chiều tà / Hoàng hôn
            app.classList.add('sky-sunset');
            ambient.style.background = 'rgba(239, 68, 68, 0.15)';
            skyIcon.innerText = '🌇';
            periodText.innerText = '(Chiều Hoàng Hôn)';
        } else {
            // Tối muộn / Đêm tối
            app.classList.add('sky-night');
            ambient.style.background = 'rgba(0, 0, 0, 0.45)';
            skyIcon.innerText = '🌙';
            periodText.innerText = '(Đêm Tối)';
        }

        const hStr = String(Game.hour).padStart(2, '0');
        const mStr = String(Game.minute).padStart(2, '0');
        document.getElementById('ui-clock').innerText = `${hStr}:${mStr}`;
    }

    // Scenarios for 7 Detailed Days with Clock Actions
    const DayScenarios = {
        1: {
            title: "Thứ 2: Họp Giao Ban Đầu Tuần",
            avatar: "👔",
            speaker: "Nguyễn & Chị Hướng",
            role: "08:30 Sáng • Trụ sở chi nhánh",
            desc: "08h30 sáng, Nguyễn bước vào phòng họp sực nức mùi nước hoa nữ Chanel của sếp Hướng. Chị Hướng ngồi chủ trì liên tục mỉm cười gật gù mỗi khi Nguyễn phát biểu chê bai các phòng khác.",
            choices: [
                {
                    text: "Lén thì thầm với Bông: 'Mùi nước hoa này quen thế nhỉ...'",
                    tag: "+15% Bằng chứng, +1h",
                    action: () => {
                        Audio.click();
                        advanceTime(1, 15);
                        Game.scandal += 15;
                        pushZalo("Bông", "Em thấy sếp Hướng vừa tặng anh Nguyễn hộp quà sáng nay á!");
                        finishEvent();
                    }
                },
                {
                    text: "Hùa theo khen: 'Anh Nguyễn hôm nay phong độ và thơm thế ạ!'",
                    tag: "+Sếp vui, -10 Tự trọng, +1h",
                    action: () => {
                        Audio.click();
                        advanceTime(1, 0);
                        Game.bossRage -= 10;
                        Game.sanity -= 10;
                        finishEvent();
                    }
                }
            ]
        },
        2: {
            title: "Thứ 3: Ngày Bình Yên - Ăn Vặt & Trà Sữa",
            avatar: "🧋",
            speaker: "Hội Chị Em Văn Phòng",
            role: "14:00 Chiều • Sếp đi vắng",
            desc: "Chiều thu nắng vàng mát mẻ, sếp Hướng và Nguyễn đi họp Tổng công ty cả ngày. Cả văn phòng cùng nhau đặt trà sữa trân châu, gọt xoài cóc dầm muối ớt, vừa ăn vừa buôn chuyện gia đình vui vẻ!",
            choices: [
                {
                    text: "Tự tay pha trà và khao em Bông cốc trà sữa full topping",
                    tag: "+30 Tinh thần, -50k, +2h",
                    action: () => {
                        Audio.success();
                        advanceTime(2, 0);
                        Game.wallet -= 50000;
                        Game.sanity = Math.min(100, Game.sanity + 30);
                        pushZalo("Bông", "Cảm ơn chị yêu! Lâu lắm phòng mình mới có ngày bình yên thế này ❤️");
                        finishEvent();
                    }
                },
                {
                    text: "Cùng Chị Lan & Chị Hạnh ngồi chia sẻ mẹo dỗ con ngủ",
                    tag: "+20 Tinh thần, +1.5h",
                    action: () => {
                        Audio.click();
                        advanceTime(1, 30);
                        Game.sanity = Math.min(100, Game.sanity + 20);
                        pushZalo("Chị Hạnh", "Chị em mình đoàn kết thế này thì sợ gì ai bắt nạt!");
                        finishEvent();
                    }
                }
            ]
        },
        3: {
            title: "Thứ 4: Cơm Trưa 'Bóc Tôm' Thân Mật",
            avatar: "🦐",
            speaker: "Quán cơm văn phòng",
            role: "12:15 Trưa Nắng Gắt",
            desc: "Trưa nắng chang chang, cả chi nhánh đi ăn cơm. Nguyễn ngồi sát rạt Chị Hướng, tự tay bóc tôm gắp tận bát cho sếp: 'Chị ăn đi cho hồng hào da dẻ'. Chị Hướng ngượng ngùng đưa tay chỉnh lại cà vạt cho Nguyễn...",
            choices: [
                {
                    text: "Lén quay video cảnh bóc tôm và chỉnh cà vạt làm bằng chứng",
                    tag: "+20% Bằng chứng, +1h",
                    action: () => {
                        Audio.success();
                        advanceTime(1, 15);
                        Game.scandal += 20;
                        pushZalo("Thắng Kế Toán", "Đoạn video sắc nét đấy, đã lưu vào hồ sơ mật!");
                        finishEvent();
                    }
                },
                {
                    text: "Cúi đầu ăn nhanh đĩa cơm sườn rồi về cơ quan ngủ trưa",
                    tag: "Né thị phi, +1h",
                    action: () => {
                        Audio.click();
                        advanceTime(1, 0);
                        Game.sanity += 10;
                        finishEvent();
                    }
                }
            ]
        },
        4: {
            title: "Thứ 5: NGÀY NHẬN LƯƠNG TING TING! 💸",
            avatar: "💰",
            speaker: "Ngân Hàng Báo Biến Động Số Dư",
            role: "11:00 Trưa",
            desc: "Ting ting! Điện thoại rung bần bật: 'Tài khoản +9.500.000 VNĐ (Lương cứng + Thưởng hoàn thành doanh số)'. Cả phòng reo hò rộn rã, không khí tràn đầy năng lượng!",
            choices: [
                {
                    text: "Rút 500k mời cả phòng ăn lẩu trưa khao lương mới",
                    tag: "+40 Tinh thần, -500k, +2h",
                    action: () => {
                        Audio.payday();
                        advanceTime(2, 0);
                        Game.wallet += 9000000;
                        Game.sanity = 100;
                        pushZalo("Toàn Chi Nhánh", "Ting ting! Chúc mừng ngày nhận lương, khao lẩu đê anh chị em ơi!");
                        finishEvent();
                    }
                },
                {
                    text: "Cất hết vào tài khoản tiết kiệm phòng thân",
                    tag: "+9.5Tr Ví, +30p",
                    action: () => {
                        Audio.payday();
                        advanceTime(0, 30);
                        Game.wallet += 9500000;
                        finishEvent();
                    }
                }
            ]
        },
        5: {
            title: "Thứ 6: Phát Hiện Đoạn Camera Mập Mờ 19h30",
            avatar: "📹",
            speaker: "Hội Chị Em Nhóm Zalo Kín",
            role: "19:30 Đêm Tối • Bãi Xe",
            desc: "19h30 tối muộn, Thắng kế toán trích xuất camera bãi xe phát hiện đoạn clip: Nguyễn tận tình khoác áo vest của mình lên vai Chị Hướng, nắm tay dắt sếp ra xe hơi rồi ôm eo chào tạm biệt...",
            choices: [
                {
                    text: "Mở Tab 'Camera Mật' để mổ xẻ từng khung hình cùng chị em",
                    tag: "+30% Bằng chứng, +1h",
                    action: () => {
                        Audio.success();
                        advanceTime(1, 0);
                        Game.scandal += 30;
                        Game.cctvClues = 1;
                        pushZalo("Trang", "Eo ơi rõ mười mươi thế này thì chối đằng trời!");
                        finishEvent();
                    }
                },
                {
                    text: "Khuyên Thắng bảo mật file cẩn thận kẻo lộ",
                    tag: "+15 Thân thiết Thắng, +30p",
                    action: () => {
                        Audio.click();
                        advanceTime(0, 30);
                        Game.scandal += 15;
                        pushZalo("Thắng Kế Toán", "Yên tâm, tôi mã hóa 2 lớp rồi.");
                        finishEvent();
                    }
                }
            ]
        },
        6: {
            title: "Thứ 7: Ngày Hội Thu Tiền Xã Áp Lực",
            avatar: "⚡",
            speaker: "Hội trường UBND Xã",
            role: "16:45 Chiều Hoàng Hôn",
            desc: "16h45 chiều hoàng hôn đỏ rực, Chị Thắm lại ôm khăn chấm nước mắt giả vờ đau bụng đùn việc. Bạn phải chạy đua với thời gian để thu đủ 150 triệu tiền quỹ trước khi trời tối sếp Hướng nổi lôi đình!",
            choices: [
                {
                    text: "Bóc mẽ Thắm giả bệnh + Quyết liệt đòi nợ dứt điểm",
                    tag: "+50Tr Quỹ, -15 HP, +2h",
                    action: () => {
                        Audio.success();
                        advanceTime(2, 0);
                        Game.quota += 50000000;
                        Game.sanity -= 15;
                        pushZalo("Chị Thắm", "Chị... chị đi thu cùng em đây, đừng mách sếp...");
                        finishEvent();
                    }
                },
                {
                    text: "Tự ứng 1.5Tr tiền lương túi bù vào cho an toàn",
                    tag: "-1.5Tr Ví, Đạt KPI, +30p",
                    action: () => {
                        Audio.click();
                        advanceTime(0, 30);
                        Game.wallet -= 1500000;
                        Game.quota += 40000000;
                        finishEvent();
                    }
                }
            ]
        },
        7: {
            title: "Chủ Nhật: Bàn Nhậu Karaoke & Vợ Nguyễn Đến!",
            avatar: "💣",
            speaker: "Nhà hàng Đầm Vạc",
            role: "21:00 Đêm Khuya",
            desc: "21h00 đêm tối, trong lúc Nguyễn đang say sưa ôm eo Chị Hướng song ca tại phòng VIP Đầm Vạc thì vợ Nguyễn bất ngờ ập vào! Mọi bằng chứng từ Camera và hóa đơn của Thắng được tung ra đúng lúc!",
            choices: [
                {
                    text: "Tung toàn bộ Video Camera & Chứng từ cho Thanh Tra Tổng Công Ty",
                    tag: "KÍCH HOẠT KẾT THÚC!",
                    action: () => {
                        triggerFinalEvaluation();
                    }
                }
            ]
        }
    };

    function updateHUD() {
        document.getElementById('ui-day-count').innerText = Game.day;
        document.getElementById('ui-day-name').innerText = Game.dayNames[Game.day - 1] || "Ngày Mới";
        document.getElementById('ui-wallet').innerText = (Game.wallet / 1000000).toFixed(1) + 'Tr';
        document.getElementById('ui-quota').innerText = (Game.quota / 1000000).toFixed(0) + '/' + (Game.quotaTarget / 1000000) + 'Tr';
        document.getElementById('ui-sanity').innerText = Game.sanity + '%';
        document.getElementById('ui-rage').innerText = Game.bossRage + '%';

        const scandalPercent = Math.min(100, Game.scandal);
        document.getElementById('ui-scandal-val').innerText = scandalPercent + '%';
        document.getElementById('ui-scandal-bar').style.width = scandalPercent + '%';

        updateTimeAndSky();
    }

    function pushZalo(sender, msg) {
        document.getElementById('zalo-msg').innerHTML = `<b>${sender}:</b> "${msg}"`;
        Game.zaloLogs.unshift({ sender, msg, day: Game.day, time: `${String(Game.hour).padStart(2,'0')}:${String(Game.minute).padStart(2,'0')}` });
    }

    function switchTab(tabId) {
        Audio.click();
        Game.activeTab = tabId;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        const idx = ['daily_event', 'cctv_spy', 'field_work', 'next_day'].indexOf(tabId);
        if (idx >= 0) document.querySelectorAll('.tab-btn')[idx].classList.add('active');

        if (tabId === 'daily_event') renderDailyEvent();
        else if (tabId === 'cctv_spy') renderCctvSpy();
        else if (tabId === 'field_work') renderFieldWork();
        else if (tabId === 'next_day') renderNextDayPrompt();
    }

    function renderDailyEvent() {
        const data = DayScenarios[Game.day];
        if (!data) return;

        document.getElementById('game-content').innerHTML = `
            <div class="event-card">
                <div class="event-header">
                    <div class="char-avatar">${data.avatar}</div>
                    <div>
                        <h3 style="font-size:14px; color:#fff;">${data.title}</h3>
                        <p style="font-size:11px; color:var(--text-dim);">${data.speaker} • ${data.role}</p>
                    </div>
                </div>
                <div class="event-desc">${data.desc}</div>
                <div class="btn-list">
                    ${data.choices.map((c, i) => `
                        <button class="btn" onclick="DayScenarios[${Game.day}].choices[${i}].action()">
                            <span>${c.text}</span>
                            <span class="btn-tag">${c.tag}</span>
                        </button>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function renderCctvSpy() {
        document.getElementById('game-content').innerHTML = `
            <div class="event-card">
                <div style="font-size:14px; font-weight:bold; color:var(--pink);">📹 CAMERA AN NINH CHI NHÁNH (TRÍCH XUẤT MẬT)</div>
                
                <div class="cctv-screen">
                    <div class="cctv-overlay">🔴 REC 19:34:12 [ĐÊM TỐI]</div>
                    <div>CAM 03: BÃI XE SAU CHI NHÁNH</div>
                    <div style="color:#cbd5e1; margin:6px 0;">
                        [HÌNH ẢNH BAN ĐÊM]: Đèn đường leo lét, một người đàn ông (áo sơ mi trắng, dáng Nguyễn) đang cẩn thận khoác áo vest lên vai người phụ nữ (đầm hoa Chị Hướng). Cả hai đứng sát nhau sau đuôi xe ô tô khoảng 5 phút trước khi cùng lên xe rời đi.
                    </div>
                    <div style="color:#64748b; font-size:10px;">Chất lượng: Full HD 1080p • Chế độ nhìn đêm (Night Vision)</div>
                </div>

                <p style="font-size:12px; color:#cbd5e1;">Hội chị em trong nhóm kín đang thảo luận sôi nổi về đoạn clip này!</p>

                <div style="display:flex; flex-direction:column; gap:8px;">
                    <button class="btn btn-pink" onclick="cctvDiscuss('zoom')">🔍 Phóng to biển số xe & khung giờ (+15% Bằng chứng, +45p)</button>
                    <button class="btn btn-info" onclick="cctvDiscuss('chat')">💬 Thảo luận cùng em Bông & Trang trong nhóm Zalo kín (+30p)</button>
                </div>
            </div>
        `;
    }

    function cctvDiscuss(type) {
        Audio.success();
        if (type === 'zoom') {
            advanceTime(0, 45);
            Game.scandal += 15;
            pushZalo("Nhóm Zalo Kín", "Trang: 'Đúng chiếc ô tô biển số 88A của anh Nguyễn rồi!'");
        } else {
            advanceTime(0, 30);
            Game.sanity += 15;
            pushZalo("Nhóm Zalo Kín", "Bông: 'Em thấy hai người hay ở lại muộn sau giờ làm lúc 20h lắm...'");
        }
        updateHUD();
        renderCctvSpy();
    }

    function renderFieldWork() {
        document.getElementById('game-content').innerHTML = `
            <div class="event-card">
                <div style="font-size:14px; font-weight:bold; color:var(--accent);">🛵 ĐI THỰC ĐỊA THU NỢ & HUY ĐỘNG VỐN</div>
                <div style="text-align:center; font-size:36px; margin:8px 0;">🛵💨🌾</div>
                <p style="font-size:12px; color:#cbd5e1;">Lội ruộng Vĩnh Tường, gõ cửa xưởng mộc Yên Lạc để hoàn thành chỉ tiêu.</p>
                <div style="display:flex; flex-direction:column; gap:8px;">
                    <button class="btn btn-primary" onclick="doFieldWork('vinhtuong')">🌾 Lội ruộng Vĩnh Tường (+30Tr Quỹ, -10 HP, +2h)</button>
                    <button class="btn btn-info" onclick="doFieldWork('yenlac')">🪵 Thuyết phục xưởng mộc Yên Lạc (+40Tr Quỹ, +2.5h)</button>
                </div>
            </div>
        `;
    }

    function doFieldWork(loc) {
        Audio.success();
        if (loc === 'vinhtuong') {
            advanceTime(2, 0);
            Game.quota += 30000000;
            Game.sanity -= 10;
            pushZalo("Đi cơ sở", "Đã thu xong 30 triệu ở Vĩnh Tường!");
        } else {
            advanceTime(2, 30);
            Game.quota += 40000000;
            pushZalo("Đi cơ sở", "Huy động thành công 40 triệu tiết kiệm tại Yên Lạc!");
        }
        updateHUD();
        renderFieldWork();
    }

    function renderNextDayPrompt() {
        document.getElementById('game-content').innerHTML = `
            <div class="event-card" style="text-align:center;">
                <div style="font-size:40px; margin-bottom:8px;">🌙😴</div>
                <h3 style="color:#fff;">Đêm Muộn - Kết Thúc Ngày ${Game.day}</h3>
                <p style="font-size:12px; color:#cbd5e1; margin:8px 0;">
                    Hiện tại là <b>${String(Game.hour).padStart(2,'0')}:${String(Game.minute).padStart(2,'0')} đêm</b>. Hãy về nhà đi ngủ để hồi phục tinh thần và bước sang ngày mới lúc 07h30 sáng mai!
                </p>
                <button class="btn btn-primary" style="justify-content:center;" onclick="advanceNextDay()">
                    🛌 Đi Ngủ & Đón Bình Minh Ngày Tiếp Theo
                </button>
            </div>
        `;
    }

    function finishEvent() {
        updateHUD();
        renderNextDayPrompt();
    }

    function advanceNextDay() {
        Audio.success();
        Game.day++;
        Game.hour = 7;
        Game.minute = 30;
        Game.sanity = Math.min(100, Game.sanity + 20);

        if (Game.day > 7) {
            triggerFinalEvaluation();
        } else {
            switchTab('daily_event');
        }
        updateHUD();
    }

    function triggerFinalEvaluation() {
        let title = "", desc = "", icon = "";
        if (Game.wallet < 0 || Game.sanity <= 0) {
            icon = "💸😭";
            title = "KẾT CỤC: KHÁNH KIỆT & UẤT ỨC NGHỈ VIỆC";
            desc = "Bạn cạn sạch tiền túi vì ứng nợ, lại chịu không nổi những màn đay nghiến và drama mập mờ ngột ngạt. Bạn chính thức nộp đơn thôi việc!";
        } else if (Game.scandal >= 60) {
            icon = "🕵️‍♂️💣";
            title = "KẾT CỤC HẢ LÒNG: NGUYỄN BỊ BẮT SỐNG & SA THẢI!";
            desc = "Nhờ các đoạn trích xuất Camera bãi xe 19h30 ban đêm, video bóc tôm và chứng từ kê khống của Thắng, Nguyễn đã bị đoàn kiểm toán Tổng công ty và vợ bắt quả tang tại trận! Chị Hướng vội vã phủi sạch quan hệ để giữ ghế. Nguyễn chính thức 'bay màu' khỏi quỹ!";
        } else if (Game.quota >= Game.quotaTarget) {
            icon = "🏆🥇";
            title = "TRUE ENDING: PHÒNG XUẤT SẮC SỐ 1 TOÀN QUỸ!";
            desc = "Bạn xuất sắc cán mốc 150 triệu, bóc mẽ thói giả ốm của Chị Thắm, khiến Chị Hướng dù thiên vị Nguyễn cũng phải ký quyết định khen thưởng cho phòng bạn!";
        } else {
            icon = "😐📋";
            title = "KẾT THÚC BÌNH THƯỜNG: SỐNG CHUNG VỚI LŨ";
            desc = "Bạn hoàn thành tuần làm việc an toàn, tài khoản nhận đủ lương thưởng, tiếp tục công việc thường nhật tại chi nhánh!";
        }

        document.getElementById('modal-body').innerHTML = `
            <div style="text-align:center;">
                <div style="font-size:48px;">${icon}</div>
                <h3 style="color:var(--accent); font-size:16px; margin:8px 0;">${title}</h3>
                <p style="font-size:12px; color:#cbd5e1; line-height:1.5; margin-bottom:14px;">${desc}</p>
                <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="location.reload()">🔄 Chơi Lại Tuần Mới</button>
            </div>
        `;
        document.getElementById('game-modal').classList.add('active');
    }

    function openZaloModal() {
        document.getElementById('modal-body').innerHTML = `
            <div>
                <h3 style="font-size:14px; color:#38bdf8; margin-bottom:8px;">📱 NHẬT KÝ ZALO CHI NHÁNH</h3>
                <div style="max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; font-size:11.5px;">
                    ${Game.zaloLogs.map(z => `
                        <div style="background:#090e17; padding:6px 8px; border-radius:6px;">
                            <span style="color:var(--accent); font-weight:bold;">[Ngày ${z.day} - ${z.time}] ${z.sender}:</span>
                            <span style="color:#cbd5e1;">${z.msg}</span>
                        </div>
                    `).join('') || '<div style="color:#64748b;">Chưa có tin nhắn mới.</div>'}
                </div>
                <button class="btn" style="width:100%; margin-top:10px; justify-content:center;" onclick="closeModal()">Đóng</button>
            </div>
        `;
        document.getElementById('game-modal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('game-modal').classList.remove('active');
    }

    window.addEventListener('click', () => Audio.init(), { once: true });
    updateHUD();
    renderDailyEvent();
</script>
</body>
</html>
